<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CLICK &amp; GROW — Idle Farm Tycoon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;padding:0}
body{background:#101708;color:#eef3da;font-family:'VT323',monospace;font-size:20px;line-height:1.25;touch-action:manipulation}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:300;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px);opacity:.35}
button{font-family:'VT323',monospace}
img.pix{image-rendering:pixelated;vertical-align:-6px}
.hidden{display:none!important}
b{color:#ffd23f;font-weight:normal}

/* ---------- header ---------- */
#hdr{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#0b1005;border-bottom:4px solid #000;position:sticky;top:0;z-index:60;flex-wrap:wrap}
#title{font-family:'Press Start 2P',monospace;font-size:13px;color:#ffd23f;text-shadow:2px 2px 0 #7a4a00,4px 4px 0 rgba(0,0,0,.5);cursor:pointer;padding:8px 6px;line-height:1.4;display:flex;align-items:center;gap:9px}
.tcoin{width:22px;height:22px;background:var(--coin0) center/contain no-repeat;image-rendering:pixelated;display:inline-block;animation:bob 1.4s infinite alternate ease-in-out}
#coinBox{font-family:'Press Start 2P',monospace;font-size:12px;color:#fff;background:#1d2a12;border:3px solid #000;box-shadow:inset 0 0 0 2px #3c5227;padding:9px 12px;display:flex;align-items:center;gap:8px}
.gcoin{width:18px;height:18px;background:var(--coin0) center/contain no-repeat;image-rendering:pixelated;display:inline-block;flex-shrink:0}
.hstat{font-size:19px;color:#a8c47f;background:#1d2a12;border:3px solid #0f150a;padding:4px 9px}
.hstat b{color:#fff}
#sndBtn{margin-left:auto;font-size:20px;background:#1d2a12;border:3px solid #0f150a;color:#eef3da;padding:4px 10px;cursor:pointer}
#evtBanner{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:80;background:#0d1307ee;border:3px solid #ffd23f;padding:4px 14px;font-size:17px;color:#ffe9a8;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:1fr 330px;gap:12px;padding:12px;max-width:1280px;margin:0 auto;align-items:start}
.panel{background:#26331b;background-image:var(--pantex);border:4px solid #0f150a;box-shadow:inset 0 0 0 3px #3c5227,0 6px 0 #0f150a;padding:12px;min-width:0}
.ptitle{font-family:'Press Start 2P',monospace;font-size:10px;color:#ffd23f;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.ptitle span{color:#a8c47f;font-size:9px}

/* ---------- clicker ---------- */
#clickPanel{display:flex;flex-direction:column;align-items:center;gap:12px}
#coin{--cw:176px;width:var(--cw);height:var(--cw);border:none;padding:0;background-color:transparent;background-image:var(--coinstrip);background-size:400% 100%;background-repeat:no-repeat;background-position:0 0;image-rendering:pixelated;cursor:pointer;filter:drop-shadow(0 8px 0 rgba(0,0,0,.45)) drop-shadow(0 0 18px rgba(255,190,40,.25));transition:transform .07s;animation:coinspin 1.15s steps(1) infinite}
#coin:active{transform:translateY(6px) scale(.99);filter:drop-shadow(0 2px 0 rgba(0,0,0,.45))}
#coin.pop{animation:none;background-position:0 0;transform:scale(.94)}
@keyframes coinspin{0%{background-position:0 0}25%{background-position:calc(var(--cw)*-1) 0}50%{background-position:calc(var(--cw)*-2) 0}75%{background-position:calc(var(--cw)*-3) 0}100%{background-position:0 0}}
.cpsRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{background:#1d2a12;border:3px solid #0f150a;padding:4px 10px;font-size:18px;color:#a8c47f}
.pill b{color:#fff;font-size:20px}
#frenzyBox{width:100%;background:#1d2a12;border:3px solid #0f150a;padding:8px 10px}
.frow{display:flex;justify-content:space-between;align-items:center;font-family:'Press Start 2P',monospace;font-size:9px;color:#a8c47f}
.frow b{font-size:15px;color:#ff9d2e}
.fbar{height:12px;background:#101607;border:2px solid #000;margin:6px 0 4px}
.fbar>div{height:100%;background:repeating-linear-gradient(90deg,#ff9d2e 0 8px,#ffd23f 8px 16px);width:0%}
#fNext{font-size:16px;color:#c9dba4;text-align:center}
.float{position:fixed;font-family:'Press Start 2P',monospace;font-size:11px;color:#ffe27a;pointer-events:none;animation:floatUp 1s forwards;z-index:99;text-shadow:2px 2px 0 #000}
@keyframes floatUp{to{transform:translateY(-70px);opacity:0}}
#gcoin{position:fixed;width:46px;height:46px;z-index:90;background:none;border:none;padding:0;cursor:pointer;background-image:var(--coin0);background-size:contain;background-repeat:no-repeat;image-rendering:pixelated;filter:drop-shadow(0 0 10px gold);animation:drift 5s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) rotate(-8deg)}to{transform:translate(24px,-20px) rotate(8deg)}}
.pt{position:fixed;width:7px;height:7px;z-index:95;pointer-events:none;background:var(--c,#ffd23f);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25);animation:burst .55s ease-out forwards}
@keyframes burst{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}

/* ---------- farm ---------- */
#landRow{margin-bottom:8px}
#landRow .buy{width:100%;text-align:left}
#seedRow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
#seedRow label{color:#a8c47f;font-size:18px}
select{background:#1d2a12;color:#eef3da;border:3px solid #0f150a;font-family:'VT323',monospace;font-size:18px;padding:4px;max-width:220px}
#seedInfo{font-size:16px;color:#c9dba4;width:100%;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#autoRow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;background:#1d2a12;border:3px solid #0f150a;padding:6px 8px}
.tgl{display:flex;align-items:center;gap:5px;font-size:17px;color:#c9dba4;cursor:pointer}
input[type=checkbox]{accent-color:#ffd23f;width:16px;height:16px}
#barnRow{display:flex;align-items:center;gap:8px;background:#1d2a12;border:3px solid #0f150a;padding:6px 8px;margin-bottom:10px;flex-wrap:wrap;font-size:18px}
#barnRow .buy{margin-left:auto}
#plotsWrap{max-height:58vh;overflow-y:auto;padding-right:4px;overflow-x:hidden}
#plotsWrap::-webkit-scrollbar{width:12px}
#plotsWrap::-webkit-scrollbar-track{background:#16200e}
#plotsWrap::-webkit-scrollbar-thumb{background:#3c5227;border:2px solid #16200e}
.area{margin-bottom:14px}
.ahead{font-size:18px;color:#ffe9c8;background-image:var(--wood);background-size:72px 24px;border:3px solid #241708;padding:3px 9px;margin-bottom:8px;display:flex;justify-content:space-between;gap:6px;text-shadow:1px 1px 0 rgba(0,0,0,.75);box-shadow:0 3px 0 #241708,inset 0 0 0 1px #a8743e}
.ahead span{color:#f2d9ac}
.ahead span+span{color:#d9b98a}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px;padding:6px;border:3px solid #142010;background-size:96px 96px;image-rendering:pixelated;box-shadow:inset 0 0 24px rgba(0,0,0,.35),0 0 0 3px #2f5e1e,0 0 0 6px #142010}
.plot{aspect-ratio:1;background-color:#5d3d1e;background-image:var(--soil);background-size:100% 100%;border:3px solid #241708;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;overflow:hidden;image-rendering:pixelated;box-shadow:inset 0 2px 0 rgba(255,255,255,.09),inset 0 -3px 0 rgba(0,0,0,.22)}
.plot:hover{border-color:#c9973f;filter:brightness(1.12)}
.crop{width:74%;height:74%;background-size:100% 100%;background-repeat:no-repeat;background-position:center;image-rendering:pixelated;z-index:2;transform-origin:50% 92%}
.crop.mid{width:58%;height:58%}
.crop.s1{width:40%;height:40%}
.crop.ghost{width:50%;height:50%;opacity:.14}
.plot.ready{border-color:#ffd23f;animation:readyPulse 1s infinite alternate;z-index:3}
@keyframes bob{from{transform:translateY(0) scale(1)}to{transform:translateY(-3px) scale(1.04)}}
.plot.s1 .crop,.plot.s2 .crop{animation:swayY 2.4s ease-in-out infinite alternate}
.plot.s3:not(.ready) .crop{animation:swayY 3.6s ease-in-out infinite alternate}
.plot.ready .crop{animation:swayR .9s ease-in-out infinite alternate}
@keyframes swayY{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes swayR{from{transform:rotate(-6deg)}to{transform:rotate(6deg) translateY(-2px)}}
.plot.popin .crop{animation:popin .32s ease-out}
@keyframes popin{0%{transform:scale(.5)}60%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes readyPulse{from{box-shadow:0 0 4px #ffd23f55}to{box-shadow:0 0 12px #ffd23f99}}
.plot.s1 .crop,.plot.s2 .crop,.plot.s3 .crop{filter:drop-shadow(0 2px 1px rgba(0,0,0,.4))}
.plot.r3.ready{border-color:#59c2ff}
.plot.r4.ready{border-color:#ffb63d}
.plot.r5.ready{border-color:#ff6b8b;animation:rainbowGlow 1.6s linear infinite}
.plot.r6.ready{animation:rainbowGlow 2s linear infinite}
@keyframes rainbowGlow{0%{box-shadow:0 0 12px #ff5f5f}25%{box-shadow:0 0 12px #ffe25f}50%{box-shadow:0 0 12px #5fff8a}75%{box-shadow:0 0 12px #5fa8ff}100%{box-shadow:0 0 12px #d55fff}}
/* fire + sparkles on high-rarity ripe crops */
.plot.ready.r4::after{content:'';position:absolute;top:2%;right:4%;width:34%;height:36%;background-image:var(--spark);background-size:200% 100%;background-position:0 0;image-rendering:pixelated;z-index:4;pointer-events:none;animation:twinkle 1s infinite}
.plot.ready.r5::after,.plot.ready.r6::after{content:'';position:absolute;top:-4%;left:28%;width:44%;height:50%;background-image:var(--flame);background-size:200% 100%;background-position:0 0;image-rendering:pixelated;z-index:4;pointer-events:none;animation:flick .5s infinite}
.plot.ready.r6::before{content:'';position:absolute;top:6%;right:0;width:38%;height:44%;background-image:var(--flame);background-size:200% 100%;background-position:0 0;image-rendering:pixelated;z-index:4;pointer-events:none;animation:flick .42s .21s infinite reverse}
@keyframes flick{0%,49%{background-position:0 0}50%,100%{background-position:100% 0}}
@keyframes twinkle{0%,49%{background-position:0 0;opacity:1}50%,100%{background-position:100% 0;opacity:.85}}
/* empty-plot garnish: grass tuft + pebble */
.plot.empty::after{content:'';position:absolute;left:6%;bottom:5%;width:44%;height:30%;background-image:var(--tuft);background-size:100% 100%;image-rendering:pixelated;z-index:1;pointer-events:none;opacity:.9}
.plot.empty::before{content:'';position:absolute;right:10%;top:12%;width:19%;height:15%;background-image:var(--stone);background-size:100% 100%;image-rendering:pixelated;z-index:1;pointer-events:none;opacity:.7}
.pbar{position:absolute;left:3px;right:3px;bottom:3px;height:5px;background:rgba(0,0,0,.6);z-index:3;border:1px solid rgba(0,0,0,.5)}
.pbar>div{height:100%;background:repeating-linear-gradient(90deg,#7be36b 0 6px,#57c94f 6px 12px)}

/* ---------- garden scenery strips ---------- */
.fscene{position:relative;height:72px;border:3px solid #142010;margin-bottom:8px;background-size:100% 100%;image-rendering:pixelated;overflow:hidden;box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.07)}
.fscene .cloud{position:absolute;width:36px;height:18px;background-image:var(--cloud);background-size:100% 100%;image-rendering:pixelated;opacity:.92;animation-name:cloudX;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes cloudX{from{left:-44px}to{left:103%}}
.fscene .bfly{position:absolute;width:14px;height:14px;background-image:var(--bfly);background-size:200% 100%;image-rendering:pixelated;z-index:3;animation-name:flap,flyX;animation-timing-function:steps(1),linear;animation-iteration-count:infinite,infinite}
@keyframes flap{0%,49%{background-position:0 0}50%,100%{background-position:100% 0}}
@keyframes flyX{0%{left:-6%;top:56%}30%{top:26%}55%{left:46%;top:60%}80%{top:30%}100%{left:103%;top:50%}}
.fscene .mote{position:absolute;width:4px;height:4px;background:var(--c,#ffe9a8);box-shadow:0 0 5px var(--c,#ffe9a8);z-index:2;animation-name:moteUp;animation-timing-function:ease-in;animation-iteration-count:infinite}
@keyframes moteUp{0%{transform:translateY(0);opacity:0}18%{opacity:.95}100%{transform:translateY(-36px);opacity:0}}

/* ---------- rarity ---------- */
.rar0{color:#c8d6b0}.rar1{color:#7be36b}.rar2{color:#59c2ff}.rar3{color:#d38bff}.rar4{color:#ffb63d}.rar5{color:#ff6b8b}
.rar6{color:#fff}
.rar6t{animation:huer 3s linear infinite}
@keyframes huer{to{filter:hue-rotate(360deg)}}
.card.rar1{border-left:6px solid #7be36b}.card.rar2{border-left:6px solid #59c2ff}.card.rar3{border-left:6px solid #d38bff}.card.rar4{border-left:6px solid #ffb63d}.card.rar5{border-left:6px solid #ff6b8b}.card.rar6{border-left:6px solid #fff}

/* ---------- shop ---------- */
#shopPanel{max-width:1280px;margin:0 auto 24px;padding:12px}
#tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.tab{font-family:'Press Start 2P',monospace;font-size:8px;padding:10px 9px;background:#1d2a12;border:3px solid #0f150a;color:#a8c47f;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab.on{color:#ffd23f;border-color:#ffd23f;background:#2c3d1c;box-shadow:0 0 10px rgba(255,210,63,.25)}
.tab:hover{color:#ffe9a8}
#shopList{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:8px}
.card{display:flex;align-items:center;gap:10px;background:#1d2a12;border:3px solid #0f150a;padding:8px;min-height:58px;transition:border-color .15s}
.card:hover{border-color:#3c5227}
.card.locked{opacity:.45;filter:grayscale(.7)}
.card.wide{grid-column:1/-1}
.cicon{width:40px;text-align:center;flex-shrink:0;font-size:27px}
.cicon img.pix{width:36px;height:36px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.cbody{flex:1;min-width:0}
.cname{font-size:19px;line-height:1.1}
.cdesc{font-size:15px;color:#9fb382;line-height:1.2}
.cdesc b{color:#eef3da}
.cbtns{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0}
.buy{font-size:17px;background:#d9a426;border:3px solid #6b4a00;color:#2b1c00;padding:5px 9px;cursor:pointer;box-shadow:0 3px 0 #6b4a00;white-space:nowrap}
.buy:hover:not(.no):not(.done){filter:brightness(1.1)}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 #6b4a00}
.buy.no{background:#4a5238;color:#77835f;box-shadow:none;border-color:#2a3120;cursor:default}
.buy.sel{background:#7be36b}
.buy.done{background:#4a5238;color:#a8c47f;cursor:default;box-shadow:none}
.buy.danger{background:#c0392b;border-color:#5e130b;color:#ffe3de;box-shadow:0 3px 0 #5e130b}
.buy.small{font-size:15px;padding:3px 7px}
.own{color:#7be36b;font-size:16px;white-space:nowrap}
.lock{color:#8899aa;font-size:16px;white-space:nowrap}
.rtag{font-size:14px}
.iotext{width:100%;height:64px;background:#101607;color:#c9dba4;border:3px solid #0f150a;font-family:monospace;font-size:11px;margin-top:6px;padding:4px}
input[type=text],input[type=number]{background:#101607;color:#eef3da;border:3px solid #0f150a;font-family:'VT323',monospace;font-size:18px;padding:4px 6px;width:110px}
.achgrid .card{min-height:48px}

/* ---------- toasts / modals ---------- */
#toasts{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:130;max-width:320px}
.toast{background:#0d1307ee;border:3px solid #ffd23f;color:#ffe9a8;padding:7px 12px;font-size:17px;animation:tin .25s;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateX(40px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px}
.mbox{background:#26331b;background-image:var(--pantex);border:4px solid #0f150a;box-shadow:0 8px 0 #0f150a,inset 0 0 0 3px #3c5227;padding:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto}
.mtitle{font-family:'Press Start 2P',monospace;font-size:12px;color:#ffd23f;margin-bottom:14px;text-align:center;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.pindots{letter-spacing:6px;font-size:24px;text-align:center;min-height:34px;font-family:'Press Start 2P',monospace;color:#ffe27a;margin-bottom:12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pkey{font-family:'Press Start 2P',monospace;font-size:16px;padding:16px 0;background:#1d2a12;border:3px solid #0f150a;box-shadow:0 4px 0 #0f150a;color:#eef3da;cursor:pointer}
.pkey:hover{background:#2c3d1c}
.pkey:active{transform:translateY(3px);box-shadow:0 1px 0 #0f150a}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:10px}
.abtn{font-size:16px;background:#3c5227;border:3px solid #0f150a;box-shadow:0 3px 0 #0f150a;color:#eef3da;padding:6px 8px;cursor:pointer;text-align:left}
.abtn:hover{filter:brightness(1.15)}
.abtn:active{transform:translateY(2px);box-shadow:0 1px 0 #0f150a}
.abtn.warn{background:#7a2a1a}
.acheck{display:flex;align-items:center;gap:8px;font-size:18px;color:#c9dba4;margin:6px 0}
.arow{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap;font-size:18px;color:#c9dba4}

/* ---------- responsive ---------- */
@media (max-width:900px){
 main{grid-template-columns:1fr;gap:10px;padding:8px}
 #clickPanel{order:-1}
 #coin{--cw:148px}
 #plotsWrap{max-height:46vh}
 .plots{grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
 .fscene{height:52px}
 body{font-size:18px}
 #shopList{grid-template-columns:1fr}
 .hstat{font-size:16px;padding:3px 6px}
 #title{font-size:11px}
 #coinBox{font-size:10px}
}
</style>
</head>
<body>

<div id="hdr">
  <div id="title"><span class="tcoin"></span>CLICK &amp; GROW</div>
  <div id="coinBox"><span class="gcoin"></span><span id="coins">0</span></div>
  <div class="hstat">CPS <b id="cps">0</b>/s</div>
  <div class="hstat">CPC <b id="cpc">1</b></div>
  <button id="sndBtn" data-act="sound">🔊</button>
</div>
<div id="evtBanner" class="hidden"></div>

<main>
  <section id="farmPanel" class="panel">
    <div class="ptitle">🚜 FARM <span id="farmLv">Lv.1</span></div>
    <div id="landRow"></div>
    <div id="seedRow">
      <label>Seed:</label><select id="seedSel"></select>
      <div id="seedInfo"></div>
    </div>
    <div id="autoRow" class="hidden"></div>
    <div id="barnRow">
      <span>🧺 Barn: <b id="barnN">0</b> crops (<span id="barnV">0</span>)</span>
      <button id="harvAllBtn" class="buy small">Harvest all</button>
      <button id="sellAllBtn" class="buy small">Sell all</button>
    </div>
    <div id="plotsWrap"></div>
  </section>

  <section id="clickPanel" class="panel">
    <div class="ptitle" style="align-self:stretch">💰 CLICKER</div>
    <button id="coin" aria-label="Click for coins"></button>
    <div class="cpsRow">
      <div class="pill">per click <b id="cpcPill">1</b></div>
      <div class="pill">auto <b id="cpsPill">0</b>/s</div>
    </div>
    <div id="frenzyBox">
      <div class="frow"><span>AUTO FRENZY</span><b id="fMult">×1</b></div>
      <div class="fbar"><div id="fFill"></div></div>
      <div id="fNext">next ×2 in 30s</div>
    </div>
    <div class="pill" style="width:100%;text-align:center">clicks <b id="clicksN">0</b> · harvests <b id="harvN">0</b></div>
  </section>
</main>

<section id="shopPanel" class="panel">
  <div class="ptitle">🛒 SHOP</div>
  <div id="tabs"></div>
  <div id="shopList"></div>
</section>

<div id="toasts"></div>

<!-- PIN pad modal -->
<div id="pinModal" class="modal hidden">

function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n < 0) return '-' + fmt(-n);
  if(n < 1000){ const r = Math.round(n*10)/10; return (r % 1 === 0 ? r.toString() : r.toFixed(1)); }
  let u = 0;
  while(n >= 1000 && u < UNITS.length-1){ n /= 1000; u++; }
  return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + UNITS[u];
}
function fmtTime(s){
  s = Math.max(0, Math.round(s));
  if(s < 60) return s + 's';
  const m = Math.floor(s/60); const r = s % 60;
  if(m < 60) return m + 'm ' + (r ? r + 's' : '');
  const h = Math.floor(m/60);

}

/* ================================================================
   PIXEL ART ENGINE — every sprite is drawn pixel-by-pixel in code
   ================================================================ */
const OUTLINE = '#1a1006';
function rng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shade(hex,f){
  const n = parseInt(hex.slice(1),16);
  const ch = v => Math.max(0, Math.min(255, Math.round(v*f)));
  const r = ch((n>>16)&255), gg = ch((n>>8)&255), b = ch(n&255);
  return '#' + ((1<<24)+(r<<16)+(gg<<8)+b).toString(16).slice(1);
}
function makeRect(w,h,draw,opt){
  opt = opt || {};
  const buf = new Array(w*h).fill(null);
  const get = (x,y) => (x>=0 && y>=0 && x<w && y<h) ? buf[y*w+x] : null;
  const set = (x,y,c) => { x=Math.round(x); y=Math.round(y); if(x>=0&&y>=0&&x<w&&y<h) buf[y*w+x]=c; };
  const g = {
    P: set,
    R: (x,y,ww,hh,c) => { for(let j=0;j<hh;j++) for(let i=0;i<ww;i++) set(x+i,y+j,c); },
    E: (cx0,cy0,rx,ry,c) => {
      for(let y=Math.floor(cy0-ry-1); y<=Math.ceil(cy0+ry+1); y++)
        for(let x=Math.floor(cx0-rx-1); x<=Math.ceil(cx0+rx+1); x++){
          const dx=(x-cx0)/(rx+.01), dy=(y-cy0)/(ry+.01);
          if(dx*dx+dy*dy <= 1) set(x,y,c);
        }
    },
    C: (x,y,r,c) => g.E(x,y,r,r,c),
    over: (x,y,ww,hh,c) => { for(let j=0;j<hh;j++) for(let i=0;i<ww;i++){ const cur=get(x+i,y+j); if(cur && cur!==OUTLINE) set(x+i,y+j,c); } }
  };
  draw(g);
  if(opt.outline !== false){
    const add = [];
    for(let y=0;y<h;y++) for(let x=0;x<w;x++)
      if(!get(x,y) && (get(x+1,y)||get(x-1,y)||get(x,y+1)||get(x,y-1))) add.push([x,y]);
    add.forEach(([x,y]) => set(x,y,OUTLINE));
  }
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx = cv.getContext('2d');
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const c=buf[y*w+x]; if(c){ ctx.fillStyle=c; ctx.fillRect(x,y,1,1); } }
  return cv;
}
function makeSpriteCanvas(size, draw, opt){ return makeRect(size,size,draw,opt); }
function makeSprite(size, draw, opt){ return makeRect(size,size,draw,opt).toDataURL(); }

function coinFrame(k){
  return makeSpriteCanvas(16, g => {
    const rx = [6.8,5.2,3.2,5.2][k];
    g.E(8,8,rx,6.9,'#c98a00');
    g.E(8,k===0?7.7:7.7,Math.max(.7,rx-1.1),5.6,'#f2b81e');

      DOL.forEach((row,r) => { for(let c=0;c<5;c++) if(row[c]==='#') g.P(6+c,5+r,'#a8720a'); });

      g.E(8,7.6,rx-2.2,4.6,'#ffd23f');
      g.P(4,3,'#fff2b0'); g.P(4,5,'#fff2b0');

      g.E(8,7.6,1.4,4.6,'#ffd23f'); g.P(7,3,'#fff2b0'); g.P(7,12,'#ffe27a');
    }
  });
}

function makeGround(cfg){
  return makeSprite(32, g => {
    g.R(0,0,32,32,cfg.base);
    const r = rng(cfg.seed||7);
    for(let k=0;k<64;k++) g.P((r()*32)|0,(r()*32)|0, r()<.5?cfg.dark:cfg.light);
    if(cfg.deco) cfg.deco(g,r);
  }, {outline:false});
}
function makeSoil(base,dark,light){
  return makeSprite(16, g => {
    g.R(0,0,16,16,base);
    const r = rng(base.length*77+light.length);
    for(let k=0;k<14;k++) g.P(1+(r()*14)|0,1+(r()*14)|0, r()<.5?dark:light);
    /* dashed furrows — reads as tilled earth, not planks */
    [4,9,13].forEach((y,fi) => { for(let x=1+fi*2;x<15;x+=5) g.R(x,y,2,1,dark); });
    for(let k=0;k<5;k++) g.P(1+(r()*14)|0,1+(r()*14)|0, light);
  }, {outline:false});
}

function skyBands(g,cols){ const n=cols.length; for(let k=0;k<n;k++) g.R(0,Math.round(k*40/n),384,Math.ceil(40/n)+1,cols[k]); }
function sunP(g,x,y,r,c,glow){ g.C(x,y,r+2.5,glow); g.C(x,y,r,c); g.P(x-1,y-1,shade(c,1.3)); }
function cloudP(g,x,y,s){
  g.E(x,y,9*s,3*s,'#ffffff'); g.E(x-7*s,y+1.5,5*s,2.2,'#eef4fa');
  g.E(x+7*s,y+1.5,5.4*s,2.3,'#eef4fa'); g.E(x+2*s,y-2.5*s,4*s,2.4*s,'#ffffff');
}
function hillR(g,y,amp,c,off){
  for(let x=0;x<384;x++){
    const h = Math.round(y + Math.sin((x+off)*0.05)*amp + Math.sin((x+off)*0.017)*amp*0.8);
    g.R(x,h,1,64-h,c);
  }
}
function fenceRow(g,y,c1,c2){
  g.R(0,y+4,384,2,c2);
  for(let x=8;x<384;x+=30){ g.R(x,y,3,11,c1); g.P(x,y,c2); g.P(x,y+8,c2); }
}
function treeP(g,x,y,s,leaf,leafD){
  g.R(x-s,y-3*s,2*s,5*s,'#6a4526');
  g.C(x,y-7*s,4.6*s,leaf); g.C(x-3.4*s,y-5*s,3*s,leafD); g.C(x+3.2*s,y-5.4*s,3.1*s,leafD);
  g.P(Math.round(x-1.6*s),Math.round(y-8.4*s),shade(leaf,1.3));
}
function barnP(g,x,y){
  g.R(x-10,y-9,20,9,'#c0392b');
  g.R(x-12,y-12,24,4,'#8a2a20'); g.R(x-11,y-11,22,1,'#a53528');
  g.R(x-3,y-6,6,6,'#5e130b'); g.R(x-3,y-6,6,1,'#7a1d10');
  g.P(x-7,y-5,'#f0e6d0'); g.P(x+7,y-5,'#f0e6d0');
}

<script>
'use strict';
/* ================================================================
   Part 3: rendering, loop, events, PIN admin menu, init
   ================================================================ */

/* ---------------- audio ---------------- */
let ACTX = null;
const sfxLast = {};
function sfx(kind){
  if(!state || !state.sound) return;
  const n = performance.now();
  if(sfxLast[kind] && n - sfxLast[kind] < 70) return;
  sfxLast[kind] = n;
  try{
    ACTX = ACTX || new (window.AudioContext||window.webkitAudioContext)();
    if(ACTX.state === 'suspended') ACTX.resume();
    const t = ACTX.currentTime;
    const o = ACTX.createOscillator(), g = ACTX.createGain();
    o.connect(g); g.connect(ACTX.destination);
    const P = {click:[520,.04,'square',.02], coin:[880,.06,'square',.03], buy:[392,.09,'square',.04],
               harvest:[660,.08,'triangle',.05], ach:[523,.3,'square',.05], err:[130,.15,'sawtooth',.05],
               golden:[1046,.25,'triangle',.06]}[kind] || [440,.05,'square',.02];
    o.type = P[2]; o.frequency.setValueAtTime(P[0], t);
    if(kind === 'harvest') o.frequency.setValueAtTime(880, t+.05);
    if(kind === 'ach'){ o.frequency.setValueAtTime(523,t); o.frequency.setValueAtTime(659,t+.1); o.frequency.setValueAtTime(784,t+.2); }
    g.gain.setValueAtTime(P[3], t); g.gain.exponentialRampToValueAtTime(.0001, t + P[1]);
    o.start(t); o.stop(t + P[1] + .02);
  }catch(e){}
}

/* ---------------- toasts ---------------- */
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = msg;
  gid('toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 2600);
  setTimeout(() => t.remove(), 3100);
  while(gid('toasts').children.length > 5) gid('toasts').firstChild.remove();
}
function floatTxt(x, y, txt){
  const s = document.createElement('div');
  s.className = 'float'; s.textContent = txt;
  s.style.left = (x - 24) + 'px'; s.style.top = (y - 34) + 'px';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1000);
}

/* ---------------- particles ---------------- */
function burst(x, y, cols, n){
  for(let k=0;k<(n||6);k++){
    const s = document.createElement('div');
    s.className = 'pt';
    s.style.left = (x-3)+'px'; s.style.top = (y-3)+'px';
    s.style.setProperty('--dx', (Math.random()*46-23)+'px');
    s.style.setProperty('--dy', (-8-Math.random()*38)+'px');
    s.style.setProperty('--c', cols[k%cols.length]);
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 620);
  }
}
function plotCenter(i){
  const el = plotEls[i]; if(!el) return null;
  const r = el.getBoundingClientRect();
  return [r.left + r.width/2, r.top + r.height/2];
}

/* ---------------- garden scenery ---------------- */
function buildScene(ai){
  const d = document.createElement('div');
  d.className = 'fscene';
  d.style.backgroundImage = 'url(' + SCENE[ai] + ')';
  let h = '';
  if([0,2,3,5].indexOf(ai) >= 0){
    const n = ai === 5 ? 1 : 2;
    for(let k=0;k<n;k++){
      h += '<div class="cloud" style="top:' + (3+Math.random()*16).toFixed(0) + '%;animation-duration:' + (26+Math.random()*24).toFixed(1) + 's;animation-delay:-' + (Math.random()*30).toFixed(1) + 's;transform:scale(' + (0.65+Math.random()*0.7).toFixed(2) + ')"></div>';
    }
  }
  if([0,2,3].indexOf(ai) >= 0){
    const n = ai === 3 ? 2 : 1;
    for(let k=0;k<n;k++){
      const rev = Math.random() < .5 ? 'reverse' : 'normal';
      h += '<div class="bfly" style="animation-duration:.22s,' + (12+Math.random()*10).toFixed(1) + 's;animation-delay:-' + (Math.random()*0.2).toFixed(2) + 's,-' + (Math.random()*14).toFixed(1) + 's;animation-direction:normal,' + rev + '"></div>';
    }
  }
  const MC = {0:'#ffe9a8',1:'#c8f0ff',2:'#ffe27a',3:'#ff9dc0',4:'#d38bff',5:'#ffd9a0',6:'#ff8c1a'};
  const mn = ai === 1 ? 3 : 5;
  for(let k=0;k<mn;k++){
    h += '<div class="mote" style="left:' + (3+Math.random()*93).toFixed(1) + '%;bottom:' + (6+Math.random()*44).toFixed(0) + '%;--c:' + MC[ai] + ';animation-duration:' + (3.4+Math.random()*3).toFixed(1) + 's;animation-delay:-' + (Math.random()*6).toFixed(1) + 's"></div>';
  }
  d.innerHTML = h;
  return d;
}

/* ---------------- farm rendering ---------------- */
let plotEls = {};
function buildFarm(){
  const wrap = gid('plotsWrap');
  wrap.innerHTML = ''; plotEls = {};
  let idx = 0;
  for(let a = 0; a < state.farmLvl; a++){
    const area = AREAS[a];
    const sec = document.createElement('div');
    sec.className = 'area';
    const head = document.createElement('div');
    head.className = 'ahead';
    head.innerHTML = '<span>' + area.icon + ' ' + area.name + '</span><span>' + area.plots + ' plots</span>';
    const grid = document.createElement('div');
    grid.className = 'plots';
    grid.style.backgroundImage = 'url(' + GROUND[a] + ')';
    grid.style.setProperty('--soil', 'url(' + SOIL[a] + ')');
    for(let k = 0; k < area.plots; k++, idx++){
      const d = document.createElement('div');
      d.className = 'plot'; d.dataset.i = idx;
      d.addEventListener('click', onPlot);
      grid.appendChild(d); plotEls[idx] = d;
      renderPlot(idx);
    }
    sec.appendChild(head); sec.appendChild(buildScene(a)); sec.appendChild(grid);
    wrap.appendChild(sec);
  }
}
function renderPlot(i){
  const e = plotEls[i]; if(!e) return;
  const p = state.plots[i];
  const ai = PLOTAREA[i] || 0;
  e.className = 'plot'; e.dataset.st = ''; delete e.dataset.ready;
  e.style.backgroundImage = 'url(' + ((i*7+13)%2 ? SOIL2[ai] : SOIL[ai]) + ')';
  if(!p){
    e.classList.add('empty');
    e.title = 'Empty plot — click to plant ' + (CROPBY[state.sel] ? CROPBY[state.sel].name : '');
    e.innerHTML = '<div class="crop ghost" style="background-image:url(' + (SPR[state.sel]||'') + ')"></div>';
    return;
  }
  const c = CROPBY[p.c]; if(!c){ delete state.plots[i]; e.innerHTML=''; return; }
  const need = growTime(c) * 1000, el = Date.now() - p.t0;
  if(el >= need){
    e.classList.add('ready', 'r' + c.r); e.dataset.ready = '1';
    e.title = c.icon + ' ' + c.name + ' — ready! Click to harvest';
    e.innerHTML = '<div class="crop" style="background-image:url(' + SPR[c.id] + ')"></div>';
  } else {
    const f = Math.max(0, el / need);
    const st = f < .34 ? '1' : f < .67 ? '2' : '3';
    e.dataset.st = st; e.classList.add('s' + st);
    e.title = c.icon + ' ' + c.name + ' — growing ' + Math.floor(f*100) + '%';
    const img = st === '1'
      ? '<div class="crop s1" style="background-image:url(' + SPROUT + ')"></div>'
      : '<div class="crop' + (st === '2' ? ' mid' : '') + '" style="background-image:url(' + (st === '2' ? YOUNG[c.id] : SPR[c.id]) + ')"></div>';
    e.innerHTML = img + '<div class="pbar"><div style="width:' + (f*100).toFixed(1) + '%"></div></div>';
  }
}
function refreshGhosts(){ for(const i in plotEls){ if(!state.plots[i]) renderPlot(+i); } }
function onPlot(e){
  const el = e.currentTarget, i = +el.dataset.i;
  const p = state.plots[i];
  if(!p) plant(i, false);
  else if(Date.now() - p.t0 >= growTime(CROPBY[p.c]) * 1000) harvest(i);
  updateHUD();
}

/* ---------------- planting / harvesting ---------------- */
function plant(i, silent){
  if(state.plots[i]) return false;
  const c = CROPBY[state.sel];
  if(!c || !unlockedCrop(c)) return false;
  const cost = state.admin.free ? 0 : c.seed;
  if(state.coins < cost){
    if(!silent){ toast('Not enough coins for ' + c.icon + ' ' + c.name + ' (' + fmt(cost) + ')'); sfx('err'); }
    return false;
  }
  state.coins -= cost;
  state.plots[i] = { c:c.id, t0: Date.now() - (state.admin.instant ? growTime(c)*1000 : 0) };
  renderPlot(i);
  const pc = plotCenter(i);
  if(pc) burst(pc[0], pc[1], ['#8a6a3a','#6a4e2a','#5fb8ff','#a8845a'], 6);
  return true;
}
function harvest(i){
  const p = state.plots[i]; if(!p) return;
  const c = CROPBY[p.c]; if(!c){ delete state.plots[i]; return; }
  if(Date.now() - p.t0 < growTime(c) * 1000) return;
  delete state.plots[i];
  state.harvests++;
  if(c.r > (state.hiRar||0)) state.hiRar = c.r;
  if(state.auto.asell && state.tAutoSell) addCoins(cropVal(c));
  else state.barn[c.id] = (state.barn[c.id]||0) + 1;
  renderPlot(i);
  const pc = plotCenter(i);
  if(pc) burst(pc[0], pc[1], [CROPCOL[c.id]||'#ffd23f','#ffd23f','#fff',RAR[c.r].c], 6 + c.r*2);
  sfx('harvest');
}
function harvestAll(){
  let n = 0;
  for(const i of Object.keys(state.plots)){
    const p = state.plots[i], c = CROPBY[p.c];
    if(c && Date.now() - p.t0 >= growTime(c) * 1000){ harvest(+i); n++; }
  }
  if(n) toast('🚜 Harvested ' + n + ' crops');
  updateHUD();
}
function sellAll(){
  let tot = 0, n = 0;
  for(const id in state.barn){ tot += cropVal(CROPBY[id]) * state.barn[id]; n += state.barn[id]; }
  if(!n) return;
  state.barn = {};
  addCoins(tot);
  toast('Sold ' + n + ' crops for ' + fmt(tot) + ' coins');
  sfx('buy'); updateHUD(); save();
}
function autoPlant(){
  if(!state.auto.aplanter || !state.tAutoPlant) return;
  const c = CROPBY[state.sel];
  if(!c || !unlockedCrop(c)) return;
  for(let i = 0; i < totalPlots(); i++){
    if(!state.plots[i]){
      const cost = state.admin.free ? 0 : c.seed;
      if(state.coins < cost) break;
      plant(i, true);
    }
  }
}

/* ---------------- farm top rows ---------------- */
function renderFarmTop(){
  gid('farmLv').textContent = 'Lv.' + state.farmLvl + ' · ' + totalPlots() + ' plots';
  const lr = gid('landRow');
  if(state.farmLvl < 7){
    const a = AREAS[state.farmLvl];
    lr.innerHTML = '<button class="buy" data-act="land" data-cost="' + a.cost + '">🏗️ Unlock ' + a.icon + ' ' + a.name + ' (+' + a.plots + ' plots) — ' + fmt(a.cost) + '</button>';
  } else {
    lr.innerHTML = '<span class="own">✔ Farm fully expanded — all 512 plots unlocked</span>';
  }
  let h = '';
  if(state.auto.aplanter) h += '<label class="tgl"><input type="checkbox" id="tgPlant"' + (state.tAutoPlant?' checked':'') + '> 🌾 Auto-Plant</label>';
  if(state.auto.aharv)    h += '<label class="tgl"><input type="checkbox" id="tgHarv"'  + (state.tAutoHarv ?' checked':'') + '> 🚜 Auto-Harvest</label>';
  if(state.auto.asell)    h += '<label class="tgl"><input type="checkbox" id="tgSell"'  + (state.tAutoSell ?' checked':'') + '> 💸 Auto-Sell</label>';
  const ar = gid('autoRow');
  ar.innerHTML = h;
  ar.className = h ? '' : 'hidden';
  ['tgPlant','tgHarv','tgSell'].forEach(id => {
    const cb = gid(id);
    if(cb) cb.addEventListener('change', () => {

      'Playtime ' + fmtTime(state.playT) + ' · Plots ' + totalPlots() + ' · Grinders ' + totalGrinders() + '<br>' +
      'CPC ' + fmt(cpc()) + ' · CPS ' + fmt(cps()) + ' · Crop bonus ×' + fmt(cropMult()) + ' · Frenzy ×' + frenzyMult(), '', '', true);
    h += card('🔊', 'Sound', 'Pixel bleeps & bloops',

    h += card('💾', 'Save file', 'Autosaves to this browser every 20s. Export → copy the code. Paste a code → Import.',

    h += card('🔒', 'Admin?', 'Tap the game title 5× (or press Ctrl+Shift+A on PC) and enter your PIN.',
      '', '', true);

  gid('shopList').innerHTML = h;
  updateHUD();

/* ---------------- HUD ---------------- */
const BUFFN = { surge:'⚡ Auto ×3', rain:'🌧️ Growth ×2', market:'📈 Prices ×2' };
function updateHUD(){
  gid('coins').textContent = fmt(state.coins);
  const C = cps(), D = cpc();
  gid('cps').textContent = fmt(C); gid('cpc').textContent = fmt(D);
  gid('cpsPill').textContent = fmt(C); gid('cpcPill').textContent = fmt(D);
  gid('clicksN').textContent = fmt(state.clicks);
  gid('harvN').textContent = fmt(state.harvests);
  /* frenzy */
  const cap = frenzyCap(), iv = frenzyInterval(), m = frenzyMult();
  gid('fMult').textContent = '×' + m;
  const st = Math.floor(state.fT / iv);
  if(Math.pow(2, st) >= cap){
    gid('fNext').textContent = 'MAX! reset in ' + Math.ceil(st*iv + 45 - state.fT) + 's';
    gid('fFill').style.width = '100%';
  } else {
    gid('fNext').textContent = 'next ×2 in ' + Math.ceil(iv - state.fT % iv) + 's';
    gid('fFill').style.width = ((state.fT % iv) / iv * 100) + '%';
  }
  /* buffs banner */
  const now = Date.now(), parts = [];
  for(const k in buffs){
    if(buffs[k].until <= now){ delete buffs[k]; continue; }
    parts.push(BUFFN[k] + ' ' + Math.ceil((buffs[k].until - now)/1000) + 's');
  }
  const eb = gid('evtBanner');
  if(parts.length){ eb.textContent = parts.join(' · '); eb.classList.remove('hidden'); }
  else eb.classList.add('hidden');
  /* barn */
  let n = 0, v = 0;
  for(const id in state.barn){ n += state.barn[id]; v += cropVal(CROPBY[id]) * state.barn[id]; }
  gid('barnN').textContent = fmt(n); gid('barnV').textContent = fmt(v);
  /* affordability */
  document.querySelectorAll('button.buy[data-cost]').forEach(b => b.classList.toggle('no', state.coins < +b.dataset.cost));
  document.querySelectorAll('button.buy[data-pcost]').forEach(b => b.classList.toggle('no', state.pr < +b.dataset.pcost));
}

function goldenReward(){

  else if(r < .6){ buffs.surge = {m:3, until:Date.now()+45000, cps:1}; toast('⚡ Click Storm! Auto income ×3 for 45s'); }
  else if(r < .85){ buffs.rain = {m:2, until:Date.now()+60000, speed:1}; toast('🌧️ Growth Rain! Crops grow ×2 for 60s'); }
  else { buffs.market = {m:2, until:Date.now()+90000, crop:1}; toast('📈 Market Boom! Crop prices ×2 for 90s'); }
  sfx('golden'); save();
}

/* ---------------- main loop ---------------- */
let lastT = Date.now(), plantAcc = 0;
function tick(){
  const now = Date.now();
  let dt = (now - lastT) / 1000; lastT = now;
  if(dt < 0) dt = 0; if(dt > 60) dt = 60;
  state.playT += dt; plantAcc += dt;
  /* frenzy cycle: ×2 every 30s, capped, holds 45s at max, resets */
  state.fT += dt;
  {
    const cap = frenzyCap(), iv = frenzyInterval(), st = Math.floor(state.fT / iv);
    if(Math.pow(2, st) >= cap && state.fT > st*iv + 45) state.fT = 0;
  }
  addCoins(cps() * dt);
  /* crops */
  for(const i in state.plots){
    const p = state.plots[i];
    const c = CROPBY[p.c];
    if(!c){ delete state.plots[i]; continue; }
    const need = growTime(c) * 1000, el = now - p.t0;
    if(el >= need){
      if(state.auto.aharv && state.tAutoHarv) harvest(+i);
      else if(plotEls[i] && !plotEls[i].dataset.ready){
        renderPlot(+i);
        const pe = plotEls[i];
        pe.classList.add('popin'); setTimeout(() => pe.classList.remove('popin'), 340);
      }
    } else {
      const e = plotEls[i];
      if(e){
        const f = el / need;
        const st = f < .34 ? '1' : f < .67 ? '2' : '3';
        if(e.dataset.st !== st) renderPlot(+i);
        else { const bar = e.querySelector('.pbar > div'); if(bar) bar.style.width = (f*100) + '%'; }
      }
    }
  }
  if(plantAcc >= 1){ plantAcc = 0; autoPlant(); }
  updateHUD();
}

/* ---------------- modals, PIN pad, admin ---------------- */
let pinBuf = '';
function openModal(id){ gid(id).classList.remove('hidden'); }
function closeModal(id){ gid(id).classList.add('hidden'); }
function drawDots(){
  let d = '';
  for(let i = 0; i < 4; i++) d += (pinBuf[i] || '·') + ' ';
  gid('pinDots').textContent = d.trim();
}
function buildPad(){
  const pad = gid('pad'); pad.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9','C','0','⌫'].forEach(k => {
    const b = document.createElement('button');
    b.className = 'pkey'; b.textContent = k;
    b.addEventListener('click', () => pinKey(k));
    pad.appendChild(b);
  });
}
function pinKey(k){
  if(k === 'C') pinBuf = '';
  else if(k === '⌫') pinBuf = pinBuf.slice(0,-1);
  else { if(pinBuf.length >= 4) return; pinBuf += k; }
  drawDots();
  if(pinBuf.length === 4) setTimeout(checkPin, 120);
}
function checkPin(){
  if(pinBuf === state.admin.pin){
    pinBuf = ''; drawDots(); sfx('ach');
    closeModal('pinModal'); openAdmin();
  } else {
    sfx('err');
    const box = gid('pinModal').querySelector('.mbox');
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    pinBuf = ''; drawDots();
  }
}
function openAdmin(){
  gid('adFree').checked = !!state.admin.free;
  gid('adInstant').checked = !!state.admin.instant;
  openModal('adminModal');
}
function exportSave(){
  const s = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  if(gid('stIO')) gid('stIO').value = s;
  if(gid('adIO')) gid('adIO').value = s;
  toast('💾 Save exported — copy the code somewhere safe');
}
function doImport(t){
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(t.trim()))));
    if(typeof o.coins !== 'number') throw new Error('bad');
    localStorage.setItem(SKEY, JSON.stringify(Object.assign(defaultState(), o)));
    location.reload();
  }catch(e){ toast('❌ Invalid save code'); sfx('err'); }
}
function wipeSave(){
  if(!confirm('Really WIPE all progress? This cannot be undone.')) return;
  localStorage.removeItem(SKEY);
  location.reload();
}
function doPrestige(){
  const p = potentialPR();
  if(p < 1){ toast('Earn at least 1B this run to prestige'); sfx('err'); return; }
  if(!confirm('Prestige for +' + p + ' points? Coins, upgrades, grinders and farm reset. Achievements & prestige points stay.')) return;
  state.pr += p; state.prAll += p;
  state.coins = startCoins(); state.lifetime = 0;
  state.clicks = 0; state.harvests = 0; state.finger = 0;
  state.cup = {}; state.grind = {}; state.farmLvl = 1;
  state.plots = {}; state.barn = {}; state.fup = {}; state.auto = {};
  state.fT = 0; buffs = {}; state.runStart = Date.now();
  buildFarm(); rebuildSeedSel(); renderFarmTop(); renderTab(); updateHUD();
  toast('✨ Prestiged! +' + p + ' points (+' + (state.prAll*5) + '% income forever)');
  sfx('ach'); save();
}

/* ---------------- unified click actions ---------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-sel]');
  if(!b) return;
  if('sel' in b.dataset && b.dataset.sel){
    state.sel = b.dataset.sel;
    updateSeedInfo(); refreshGhosts(); sfx('click'); renderTab();
    return;
  }
  const act = b.dataset.act, id = b.dataset.id;
  const afford = c => { if(state.coins >= c){ state.coins -= c; return true; } toast('Not enough coins'); sfx('err'); return false; };
  switch(act){
    case 'sound':
      state.sound = !state.sound;
      gid('sndBtn').textContent = state.sound ? '🔊' : '🔇';
      if(state.sound) sfx('click');
      break;
    case 'finger': { const cost = 100 * Math.pow(1.4, state.finger); if(afford(cost)){ state.finger++; sfx('buy'); } break; }
    case 'cup': { const u = CUPBY[id]; if(u && !state.cup[u.id] && afford(u.cost)){ state.cup[u.id] = 1; toast(u.icon + ' ' + u.name + ' equipped!'); sfx('buy'); } break; }
    case 'grind': { const g = GRBY[id]; if(g && afford(grinderCost(g, state.grind[g.id]||0))){ state.grind[g.id] = (state.grind[g.id]||0)+1; sfx('buy'); } break; }
    case 'grind10': { const g = GRBY[id]; if(g && afford(grinderCost10(g, state.grind[g.id]||0))){ state.grind[g.id] = (state.grind[g.id]||0)+10; sfx('buy'); } break; }
    case 'fup': {
      const f = FUPBY[id]; const lvl = state.fup[id]||0;
      if(f && lvl < f.max && afford(f.base * Math.pow(f.mult, lvl))){ state.fup[id] = lvl+1; sfx('buy'); }
      break;
    }
    case 'land': {
      if(state.farmLvl < 7){
        const a = AREAS[state.farmLvl];
        if(afford(a.cost)){ state.farmLvl++; toast('🏗️ ' + a.name + ' unlocked! +' + a.plots + ' plots'); sfx('buy'); buildFarm(); rebuildSeedSel(); }
      }
      break;
    }
    case 'auto': { const a = AUTBY[id]; if(a && !state.auto[a.id] && afford(a.cost)){ state.auto[a.id] = 1; toast(a.icon + ' ' + a.name + ' online!'); sfx('buy'); renderFarmTop(); } break; }
    case 'autolvl': {
      const a = AUTBY[id]; const lvl = state.auto[id]||0;
      if(a && lvl < a.max && afford(a.base * Math.pow(a.mult, lvl))){ state.auto[id] = lvl+1; sfx('buy'); }
      break;
    }
    case 'prup': {
      const p = PRBY[id]; const lvl = state.pup[id]||0;
      if(p && lvl < p.max){
        const cost = p.cbase + p.cmul * lvl;
        if(state.pr >= cost){ state.pr -= cost; state.pup[id] = lvl+1; toast(p.icon + ' ' + p.name + ' Lv.' + (lvl+1)); sfx('buy'); }
        else { toast('Not enough prestige points'); sfx('err'); }
      }
      break;
    }
    case 'prestige': doPrestige(); break;
    case 'export': break; /* runs after refreshUI so the fresh textarea gets filled */
    case 'import': { const t = gid('stIO') ? gid('stIO').value : ''; if(t.trim()) doImport(t); else { toast('Paste a save code first'); sfx('err'); } break; }
    case 'wipe': wipeSave(); break;
    /* ---------- admin actions ---------- */
    case 'a1k': addCoins(1e3);  toast('💰 +1K'); break;
    case 'a1m': addCoins(1e6);  toast('💰 +1M'); break;
    case 'a1b': addCoins(1e9);  toast('💰 +1B'); break;
    case 'a1t': addCoins(1e12); toast('💰 +1T'); break;
    case 'acustom': { const v = Number(gid('adNum').value); if(v > 0){ addCoins(v); toast('💰 +' + fmt(v)); } break; }
    case 'aset': { const v = Number(gid('adNum').value); if(v >= 0){ state.coins = v; toast('💰 Coins set to ' + fmt(v)); } break; }
    case 'apr10': state.pr += 10; state.prAll += 10; toast('✨ +10 prestige points'); break;
    case 'apr100': state.pr += 100; state.prAll += 100; toast('✨ +100 prestige points'); break;
    case 'aseeds':
      state.admin.allSeeds = !state.admin.allSeeds;
      toast(state.admin.allSeeds ? '🌱 All seeds unlocked' : '🔒 Seed locks restored');
      rebuildSeedSel(); renderTab();
      break;
    case 'afarm': state.farmLvl = 7; buildFarm(); rebuildSeedSel(); toast('🚜 Farm maxed: 512 plots'); break;
    case 'agrind': GRINDERS.forEach(g => state.grind[g.id] = (state.grind[g.id]||0) + 10); toast('⚙️ +10 of every grinder'); break;
    case 'aclick': state.finger += 25; CLICKUPS.forEach(u => state.cup[u.id] = 1); toast('👆 Click upgrades maxed'); break;
    case 'aripe':
      for(const i in state.plots){
        const p = state.plots[i], c = CROPBY[p.c];
        if(c){ p.t0 = Date.now() - growTime(c)*1000; renderPlot(+i); }
      }
      toast('🌱 All crops ripened');
      break;
    case 'aharv': harvestAll(); break;
    case 'awarp': { const v = cps()*3600; addCoins(v); toast('⏩ +1 hour of income: +' + fmt(v)); break; }
    case 'afrenzy': state.fT = frenzyInterval() * Math.log2(frenzyCap()) + 5; toast('⚡ Frenzy set to MAX'); break;
    case 'asetpin': {
      const v = gid('adPin').value.trim();
      if(/^\d{4}$/.test(v)){ state.admin.pin = v; gid('adPin').value = ''; toast('🔑 PIN changed to ' + v); }
      else { toast('PIN must be exactly 4 digits'); sfx('err'); }
      break;
    }
    case 'adimport': { const t = gid('adIO').value; if(t.trim()) doImport(t); else { toast('Paste a save code first'); sfx('err'); } break; }
    case 'adwipe': wipeSave(); break;
    default: return;
  }
  refreshUI();
  if(act === 'export') exportSave();
  save();
});
function refreshUI(){ renderFarmTop(); rebuildSeedSel(); renderTab(); }

/* ---------------- keyboard / title taps ---------------- */
let taps = 0, tapTime = 0;
document.addEventListener('keydown', e => {
  if(!gid('pinModal').classList.contains('hidden')){
    if(/^[0-9]$/.test(e.key)) pinKey(e.key);
    else if(e.key === 'Backspace') pinKey('⌫');
    else if(e.key === 'Escape') closeModal('pinModal');
    else if(e.key === 'Enter') checkPin();
    e.preventDefault();
    return;
  }
  if(e.key === 'Escape'){ closeModal('adminModal'); return; }
  if(e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')){ e.preventDefault(); pinBuf=''; drawDots(); openModal('pinModal'); }
});
['pinModal','adminModal'].forEach(id => {
  gid(id).addEventListener('click', e => { if(e.target === gid(id)) closeModal(id); });
});

/* ---------------- init ---------------- */
function init(){
  state = load();
  /* offline earnings: 25% rate, capped at 8h */
  const away = (Date.now() - (state.last||Date.now())) / 1000;
  if(away > 120){
    const gain = cps() * Math.min(away, 8*3600) * 0.25;
    if(gain >= 1){
      addCoins(gain);
      setTimeout(() => toast('🌙 Welcome back! Your farm earned ' + fmt(gain) + ' coins while away'), 600);
    }
  }
  gid('sndBtn').textContent = state.sound ? '🔊' : '🔇';
  buildFarm(); buildTabs(); renderFarmTop(); rebuildSeedSel(); renderTab(); updateHUD();
  buildPad(); drawDots();
  gid('title').addEventListener('click', () => {
    const n = Date.now();
    if(n - tapTime > 2500) taps = 0;
    tapTime = n;
    if(++taps >= 5){ taps = 0; pinBuf = ''; drawDots(); openModal('pinModal'); }
  });
  gid('adFree').addEventListener('change', () => { state.admin.free = gid('adFree').checked; rebuildSeedSel(); });
  gid('adInstant').addEventListener('change', () => { state.admin.instant = gid('adInstant').checked; });
  gid('seedSel').addEventListener('change', () => { state.sel = gid('seedSel').value; updateSeedInfo(); refreshGhosts(); sfx('click'); });
  gid('harvAllBtn').addEventListener('click', harvestAll);
  gid('sellAllBtn').addEventListener('click', sellAll);
  gid('pinClose').addEventListener('click', () => closeModal('pinModal'));
  gid('adminClose').addEventListener('click', () => closeModal('adminModal'));
  const coin = gid('coin');
  coin.addEventListener('click', e => {
    const v = cpc();
    addCoins(v); state.clicks++;
    floatTxt(e.clientX || innerWidth/2, e.clientY || 200, '+' + fmt(v));
    burst(e.clientX || innerWidth/2, e.clientY || 200, ['#ffd23f','#fff2b0','#e09a00'], 4);
    coin.classList.add('pop'); setTimeout(() => coin.classList.remove('pop'), 90);
    sfx('click');
  });
  coin.addEventListener('contextmenu', e => e.preventDefault());
  setInterval(tick, 250);
  setInterval(checkAch, 2000);
  setInterval(save, 20000);
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if(document.hidden) save(); });
  scheduleGolden();
  if(state.lifetimeAll === 0) setTimeout(() => toast('👋 Click the coin and plant your first seeds!'), 800);
}
init();
</script>
</body>
